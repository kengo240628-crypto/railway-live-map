
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全国鉄道案内</title>
<style>
body{font-family:sans-serif;margin:0;background:#eef4fa;color:#18324d}
header{background:#123b67;color:white;padding:22px 16px}
main{padding:16px}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:8px}
input{border:1px solid #aaa}
button{background:#1768ac;color:white;border:0}
</style>
</head>
<body>
<header>
<h1>🚆 全国鉄道案内</h1>
全国の駅・路線・運行情報
</header>
<main>
<div class="card">
<h2>🔎 駅を検索</h2>
<input id="station" placeholder="駅名（例：東京）">
<button onclick="searchStation()">駅を検索</button>
<p id="result">駅名を入力して検索してください。</p>
</div>
<div class="card">
<h2>🚦 運行情報</h2>
<p>最新の運行状況は、公式サイトで確認できます。</p>
<ul>
<li><a href="https://traininfo.jreast.co.jp/train_info/" target="_blank" rel="noopener noreferrer">JR東日本</a></li>
<li><a href="https://traininfo.jr-central.co.jp/" target="_blank" rel="noopener noreferrer">JR東海</a></li>
<li><a href="https://trafficinfo.westjr.co.jp/" target="_blank" rel="noopener noreferrer">JR西日本</a></li>
<li><a href="https://www3.jrhokkaido.co.jp/webunkou/" target="_blank" rel="noopener noreferrer">JR北海道</a></li>
</ul>
<p>※最新の運行状況はリンク先で確認してください。</p>
</div><div class="card">
<h2>🚄 列車の走行位置</h2>
<p>列車位置データ未接続</p>
</div>

<div class="card">
  <h2>🕒 駅の時刻表</h2>
  <p>駅の時刻表は、各鉄道会社の公式サイトで確認できます。</p>
  <ul>
    <li>
      <a href="https://timetables.jreast.co.jp/" target="_blank" rel="noopener noreferrer">
        JR東日本
      </a>
    </li>
    <li>
      <a href="https://railway.jr-central.co.jp/timetable/nr_doc/search.html?s=1" target="_blank" rel="noopener noreferrer">
        JR東海
      </a>
    </li>
    <li>
      <a href="https://www.jr-odekake.net/eki/" target="_blank" rel="noopener noreferrer">
        JR西日本
      </a>
    </li>
  </ul>
  <p>※リンク先で駅名を検索してください。</p>
</div>

</main>
<script>
async function searchStation(){
const name=document.getElementById("station").value.trim();
const result=document.getElementById("result");
if(!name){result.textContent="駅名を入力してください。";return;}
result.textContent="検索中…";
try{
const url="https://train.teraren.com/stations.json?name="+encodeURIComponent(name);
const response=await fetch(url);
if(!response.ok)throw new Error();
const data=await response.json();
if(!Array.isArray(data)||data.length===0){
result.textContent="駅が見つからないか、データがありません。";
return;
}
result.innerHTML = "";
data.slice(0,10).forEach(s => {
  const button = document.createElement("button");
  button.textContent = s.station_name;
  button.style.margin = "4px";
  button.onclick = () => {
    document.getElementById("station").value = s.station_name;
    const stationName = s.station_name;

document.getElementById("station").value = stationName;

const routes = {
  "東京": [
    "東海道新幹線",
    "東北・北海道新幹線",
    "山手線",
    "中央線",
    "東海道線",
    "京浜東北線",
    "横須賀線",
    "京葉線",
    "丸ノ内線"
  ],
  "品川": [
    "東海道新幹線",
    "山手線",
    "京浜東北線",
    "東海道線",
    "横須賀線"
  ],
  "新横浜": [
    "東海道新幹線",
    "横浜線",
    "横浜市営地下鉄ブルーライン",
    "相鉄・東急新横浜線"
  ],
  "小田原": [
    "東海道新幹線",
    "東海道線",
    "小田急線",
    "箱根登山線"
  ],
  "熱海": [
    "東海道新幹線",
    "東海道線",
    "伊東線"
  ],
  "静岡": [
    "東海道新幹線",
    "東海道線"
  ],
  "浜松": [
    "東海道新幹線",
    "東海道線"
  ]
};

const stationRoutes = routes[stationName];

result.style.whiteSpace = "pre-line";
result.textContent =
  "選択した駅：" + stationName +
  "\n乗り入れ路線：" +
  (stationRoutes
    ? stationRoutes.join("、")
    : "この駅の路線データはまだありません。");
  };
  result.appendChild(button);
});
}catch(e){
result.textContent="取得できませんでした。通信やAPIの状態を確認してください。";
}
}
</script>
</body>
</html>
